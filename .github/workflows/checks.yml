name: Check AgencyOS
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: node --check workspace.js

      - run: node --check luxury.js
      - run: node --test tests/luxury.test.cjs

      - run: node --check channels.js
      - run: node --test tests/channels.test.cjs

      - run: node --check growth.js
      - run: node --test tests/growth.test.cjs
