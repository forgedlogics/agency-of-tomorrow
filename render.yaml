services:
  - type: web
    name: agencyos-visual-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENCYOS_ALLOWED_ORIGINS
        value: https://forgedlogics.github.io
